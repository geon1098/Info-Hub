server:
  port: 8093

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/infohub_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload:
    dir: ./uploads/images
    public-base: http://localhost:8093/images

jwt:
  secret: ZGV2LWluZm9odWItc2VjcmV0LWtleS1tdXN0LWJlLWxvbmctZW5vdWdoLWZvci1obWFjLXNoYTI1Ng==
  access-token-validity: 1800000      # 30분
  refresh-token-validity: 604800000   # 7일

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
  file:
    name: ./backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"